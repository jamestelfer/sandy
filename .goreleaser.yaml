# GoReleaser configuration for the Sandy release pipeline.
# Driven by the chinmina/.github goreleaser-release reusable workflow
# (.github/workflows/release.yml) on tag push.
version: 2

project_name: sandy

before:
  hooks:
    - bun install --frozen-lockfile
    - bun run prebuild

builds:
  - id: sandy
    builder: bun
    binary: sandy
    main: src/main.ts
    targets:
      - linux-x64
      - linux-arm64
      - darwin-x64
      - darwin-arm64

archives:
  - id: sandy
    ids:
      - sandy
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{- if eq .Arch "amd64" }}x64{{- else }}{{ .Arch }}{{- end }}

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: jamestelfer
    name: sandy
  # release-please creates the draft first; goreleaser reuses it without
  # publishing. The reusable workflow publishes after attestation completes.
  draft: true
  mode: keep-existing
  use_existing_draft: true
  prerelease: auto

homebrew_casks:
  - name: sandy
    ids:
      - sandy
    directory: Casks
    homepage: https://github.com/jamestelfer/sandy
    description: Sandboxed TypeScript runtime with AWS SDK access for AI agents
    repository:
      owner: jamestelfer
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_GITHUB_TOKEN }}"
    binaries:
      - sandy
    commit_msg_template: "sandy {{ .Version }}"
    skip_upload: auto
    # hooks.post.install emits the `postflight` stanza, which Homebrew has
    # deprecated in favour of `postflight_steps`. custom_block carries the step
    # until goreleaser ships hooks.post.install_steps (goreleaser/goreleaser#6873).
    # `{{ "{{staged_path}}" }}` escapes Homebrew's `{{staged_path}}` token past
    # goreleaser's template pass over the rendered cask.
    # Bun's ad-hoc signature can fail at runtime on arm64, so strip it (best-effort) and re-sign.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/sandy"]
          run "/usr/bin/codesign", args: ["--remove-signature", "{{ "{{staged_path}}" }}/sandy"], print_stderr: false, must_succeed: false
          run "/usr/bin/codesign", args: ["-s", "-", "--force", "{{ "{{staged_path}}" }}/sandy"]
        end
      end
