name: release

# Filename must remain release.yml: npm trusted publishing validates the
# caller workflow filename when the npm channel lands (see plans/npm-release-channel.md).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: chinmina/.github/.github/workflows/goreleaser-release.yml@verified-actions
    with:
      token-source: octo-sts
      disable-binstaller: false
      disable-homebrew: false
    secrets: inherit
